version: '3.8'
services:
  # Base de datos PostgreSQL
  postgres-burbujapp:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: burbujapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_burbujapp_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  # BurbujaApp API - Microservicio único modular
  burbujapp-api:
    build: .
    ports:
      - "5000:80"
    depends_on:
      postgres-burbujapp:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres-burbujapp;Database=burbujapp;Username=postgres;Password=rootpassword;
      - JwtSettings__Key=tu-super-secret-jwt-key-aqui-minimo-32-caracteres-para-seguridad-burbuja-app
      - JwtSettings__Issuer=BurbujaApp
      - JwtSettings__Audience=BurbujaApp-Client
      - JwtSettings__ExpiryInMinutes=60
      - JwtSettings__RefreshTokenExpiryInDays=7
    restart: unless-stopped

volumes:
  postgres_burbujapp_data:
